name: Deploy

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  build:
    needs: tests
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev cmake

      - name: Create Build Environment
        run: cmake -E make_directory ${{runner.workspace}}/build

      - name: Configure CMake
        working-directory: ${{runner.workspace}}/build
        run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: ${{runner.workspace}}/build
        run: cmake --build . --config Release

      - name: Create DEB Package
        id: create-deb-package
        working-directory: ${{runner.workspace}}/build
        run: cpack

      - name: Release DEB
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF##*/}" ${{runner.workspace}}/build/*.deb

  build-windows:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cross-compile Windows (Release, amd64 + arm64)
        run: bash windows/win-cross-build.sh both

      - name: Upload Windows executables
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build-windows-amd64-release/t2sz.exe t2sz-amd64.exe
          cp build-windows-arm64-release/t2sz.exe t2sz-arm64.exe
          gh release upload "${GITHUB_REF##*/}" t2sz-amd64.exe t2sz-arm64.exe

  homebrew:
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger Homebrew tap update
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          gh api repos/martinellimarco/homebrew-t2sz/dispatches \
            -f event_type=formula-update \
            -f "client_payload[tag]=${GITHUB_REF##*/}"
